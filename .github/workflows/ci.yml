name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean style (100-col / trailing-ws / tabs)
        run: python3 scripts/style-check.py

  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false is load-bearing. checkout otherwise writes its own
      # GITHUB_TOKEN into http.https://github.com/.extraheader, and that header overrides
      # the credentials in a rewritten URL. GITHUB_TOKEN can only see this repository, so
      # every dependency comes back as "Repository not found" even when the PAT
      # in the secret has access to all of them.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The credential is set here and left in place; removing it
      # in this same step would leave the build unauthenticated.
      #
      # `secrets` is not available to `if:` expressions -- using it there is a workflow
      # validation error that produces zero jobs and a failing run that never built
      # anything. `test -n` is the guard instead.
      - name: Authenticate Lake dependencies
        env:
          TERMCOLOR_READ_TOKEN: ${{ secrets.TERMCOLOR_READ_TOKEN }}
        run: |
          test -n "$TERMCOLOR_READ_TOKEN"
          git config --global url."https://x-access-token:${TERMCOLOR_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
      # lake reports a bare "git exited with code 128" when it cannot reach a
      # dependency, without saying which one or why. Check each up front so a token that
      # is missing a repository fails with the repository's name.
      - name: Lake dependencies must be reachable
        env:
          TERMCOLOR_READ_TOKEN: ${{ secrets.TERMCOLOR_READ_TOKEN }}
        run: |
          if [ -z "$TERMCOLOR_READ_TOKEN" ]; then
            echo "::error::TERMCOLOR_READ_TOKEN is empty or unset."
            exit 1
          fi
          echo "token length: ${#TERMCOLOR_READ_TOKEN}, prefix: ${TERMCOLOR_READ_TOKEN%%_*}_"
          # Is the token itself valid, before asking about any repository?
          code=$(curl -s -o /tmp/who -w '%{http_code}' \
            -H "Authorization: Bearer $TERMCOLOR_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" https://api.github.com/user)
          echo "GET /user -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::The token is not a valid GitHub credential (HTTP $code)."
            head -c 300 /tmp/who; echo
            exit 1
          fi
          echo "authenticated as: $(python3 -c 'import json;print(json.load(open("/tmp/who"))["login"])')"
          missing=0
          for repo in grip lean-termcolor lean-termcolor-layout lean-termcolor-terminal; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TERMCOLOR_READ_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/jonaprieto/$repo")
            if [ "$code" = "200" ]; then
              echo "ok        jonaprieto/$repo"
            else
              echo "NO ACCESS jonaprieto/$repo (HTTP $code)"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::The token is valid but cannot read every dependency. A fine-grained PAT needs each repository selected explicitly."
            exit 1
          fi
          git config --global --unset-all http."https://github.com/".extraheader || true
          git config --unset-all http."https://github.com/".extraheader || true
          git config --global url."https://x-access-token:${TERMCOLOR_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          git ls-remote https://github.com/jonaprieto/grip.git HEAD >/dev/null
          echo "git clone path works through the credential rewrite"
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Argus Argus.Term Argus.Properties tests demo readme completion-fixture"
      - name: Run the test suite
        run: ./.lake/build/bin/tests
      # ubuntu-latest ships bash only. Without these the shell checks below silently
      # degrade to "command not found", which is exit 127 rather than a real verdict.
      - name: Install the shells the completions target
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - name: Generated completion scripts must be valid shell
        run: |
          ./.lake/build/bin/demo --completions bash > /tmp/c.bash
          ./.lake/build/bin/demo --completions zsh  > /tmp/c.zsh
          ./.lake/build/bin/demo --completions fish > /tmp/c.fish
          bash -n /tmp/c.bash
          zsh -n /tmp/c.zsh
          fish -n /tmp/c.fish
      # Asserting on the script's text cannot tell you whether a shell offers the right
      # words. This sources it and drives COMP_WORDS at three depths.
      - name: Completions must offer the right words at each depth
        shell: bash
        run: |
          ./.lake/build/bin/completion-fixture --completions bash > /tmp/t.bash
          bash -n /tmp/t.bash
          comp() {
            ( source /tmp/t.bash
              COMP_WORDS=($1); COMP_CWORD=$2
              _tool_completions
              printf '%s ' "${COMPREPLY[@]}" )
          }
          root=$(comp "tool ''" 1)
          leaf=$(comp "tool build ''" 2)
          sib=$(comp "tool test ''" 2)
          nest=$(comp "tool inner ''" 2)
          echo "root=[$root] leaf=[$leaf] sib=[$sib] nest=[$nest]"
          case "$root" in *build*test*inner*) ;; *) echo "root arm wrong"; exit 1;; esac
          case "$leaf" in *--release*) ;; *) echo "leaf arm missing its flag"; exit 1;; esac
          case "$leaf" in *--jobs*) echo "sibling flag leaked into leaf"; exit 1;; esac
          case "$sib"  in *--jobs*) ;; *) echo "sibling arm missing its flag"; exit 1;; esac
          case "$nest" in *leaf*) ;; *) echo "nested arm wrong"; exit 1;; esac
