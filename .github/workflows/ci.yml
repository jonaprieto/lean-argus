name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lean style (100-col / trailing-ws / tabs)
        run: python3 scripts/style-check.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Every dependency is private: grip, termcolor, termcolor-layout,
      # termcolor-terminal. The credential is set here and left in place; removing it
      # in this same step would leave the build unauthenticated.
      #
      # `secrets` is not available to `if:` expressions -- using it there is a workflow
      # validation error that produces zero jobs and a failing run that never built
      # anything. `test -n` is the guard instead.
      - name: Authenticate private Lake dependencies
        env:
          TERMCOLOR_READ_TOKEN: ${{ secrets.TERMCOLOR_READ_TOKEN }}
        run: |
          test -n "$TERMCOLOR_READ_TOKEN"
          git config --global url."https://x-access-token:${TERMCOLOR_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lakefile.lean', 'lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Argus Argus.Term Argus.Properties tests demo readme completion-fixture"
      - name: Run the test suite
        run: ./.lake/build/bin/tests
      - name: Generated completion scripts must be valid shell
        run: |
          ./.lake/build/bin/demo --completions bash > /tmp/c.bash
          ./.lake/build/bin/demo --completions zsh  > /tmp/c.zsh
          bash -n /tmp/c.bash
          zsh -n /tmp/c.zsh
      # Asserting on the script's text cannot tell you whether a shell offers the right
      # words. This sources it and drives COMP_WORDS at three depths.
      - name: Completions must offer the right words at each depth
        shell: bash
        run: |
          ./.lake/build/bin/completion-fixture --completions bash > /tmp/t.bash
          bash -n /tmp/t.bash
          comp() {
            ( source /tmp/t.bash
              COMP_WORDS=($1); COMP_CWORD=$2
              _tool_completions
              printf '%s ' "${COMPREPLY[@]}" )
          }
          root=$(comp "tool ''" 1)
          leaf=$(comp "tool build ''" 2)
          sib=$(comp "tool test ''" 2)
          nest=$(comp "tool inner ''" 2)
          echo "root=[$root] leaf=[$leaf] sib=[$sib] nest=[$nest]"
          case "$root" in *build*test*inner*) ;; *) echo "root arm wrong"; exit 1;; esac
          case "$leaf" in *--release*) ;; *) echo "leaf arm missing its flag"; exit 1;; esac
          case "$leaf" in *--jobs*) echo "sibling flag leaked into leaf"; exit 1;; esac
          case "$sib"  in *--jobs*) ;; *) echo "sibling arm missing its flag"; exit 1;; esac
          case "$nest" in *leaf*) ;; *) echo "nested arm wrong"; exit 1;; esac
