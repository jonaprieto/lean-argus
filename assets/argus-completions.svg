<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Argus shell completions</title>
  <desc id="desc">A terminal gallery showing generated bash, zsh, and fish completion branches.</desc>
  <rect width="1200" height="420" rx="20" fill="#181825"/>
  <text x="48" y="62" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="28" font-weight="700">One command tree · three shells</text>
  <text x="48" y="94" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="17">pure completion generation follows the same reachable Spec nodes</text>
  <g font-family="SFMono-Regular,Menlo,monospace">
    <rect x="40" y="128" width="350" height="230" rx="14" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2"/>
    <text x="68" y="174" fill="#f9e2af" font-size="19" font-weight="700">bash</text><text x="68" y="216" fill="#cdd6f4" font-size="17">grepish --&lt;TAB&gt;</text><text x="68" y="252" fill="#94e2d5" font-size="17">--ignore-case</text><text x="68" y="284" fill="#94e2d5" font-size="17">--line-number</text><text x="68" y="316" fill="#94e2d5" font-size="17">--jobs  --timeout</text>
    <rect x="425" y="128" width="350" height="230" rx="14" fill="#1e1e2e" stroke="#cba6f7" stroke-width="2"/>
    <text x="453" y="174" fill="#cba6f7" font-size="19" font-weight="700">zsh</text><text x="453" y="216" fill="#cdd6f4" font-size="17">grepish --&lt;TAB&gt;</text><text x="453" y="252" fill="#94e2d5" font-size="17">--ignore-case</text><text x="453" y="284" fill="#94e2d5" font-size="17">--line-number</text><text x="453" y="316" fill="#94e2d5" font-size="17">--jobs  --timeout</text>
    <rect x="810" y="128" width="350" height="230" rx="14" fill="#1e1e2e" stroke="#94e2d5" stroke-width="2"/>
    <text x="838" y="174" fill="#94e2d5" font-size="19" font-weight="700">fish</text><text x="838" y="216" fill="#cdd6f4" font-size="17">grepish --&lt;TAB&gt;</text><text x="838" y="252" fill="#94e2d5" font-size="17">--ignore-case</text><text x="838" y="284" fill="#94e2d5" font-size="17">--line-number</text><text x="838" y="316" fill="#94e2d5" font-size="17">--jobs  --timeout</text>
  </g>
</svg>
